[package]
name = "bilisum"
version = "0.1.0"
edition = "2021"
description = "B站 / YouTube 视频字幕与摘要 CLI"
license = "MIT"
repository = "https://github.com/Mieluoxxx/bilisum"
homepage = "https://github.com/Mieluoxxx/bilisum"
readme = "README.md"
keywords = ["bilibili", "youtube", "transcription", "summarization", "cli"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "bilisum"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.12"
indicatif = "0.18"
dirs = "6"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
qrcode = "0.14"
hound = "3.5"
quick-xml = "0.39"
whisper-rs = { version = "0.16", features = ["metal"] }

[profile.release]
opt-level = 3
lto = "thin"
